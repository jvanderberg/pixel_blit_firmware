[package]
name = "pixel_blit_firmware"
version = "0.1.0"
edition = "2021"
license = "Polyform-Noncommercial-1.0.0"

[lib]
name = "pixel_blit"
path = "src/lib.rs"

[[bin]]
name = "pixel_blit_firmware"
path = "src/main.rs"
required-features = ["firmware"]

[features]
default = ["firmware"]
firmware = [
    "view-test",
    "dep:embassy-executor",
    "dep:embassy-time",
    "dep:embassy-rp",
    "dep:embassy-sync",
    "dep:embassy-usb",
    "dep:cortex-m",
    "dep:cortex-m-rt",
    "dep:defmt",
    "dep:defmt-rtt",
    "dep:panic-probe",
    "dep:embedded-hal",
    "dep:embedded-hal-async",
    "dep:static_cell",
    "dep:sh1106",
    "dep:embedded-sdmmc",
    "dep:embedded-hal-bus",
]
# View testing - includes embedded-graphics for rendering
view-test = [
    "dep:embedded-graphics",
]

[dependencies]
# Reducto state management (always needed)
reducto = { path = "../../reducto" }

# Heapless collections (always needed for no_std)
heapless = "0.8"

# === Firmware-only dependencies ===

# Embassy framework (using git for RP2350 fixes)
embassy-executor = { git = "https://github.com/embassy-rs/embassy", features = ["arch-cortex-m", "executor-thread", "defmt"], optional = true }
embassy-time = { git = "https://github.com/embassy-rs/embassy", features = ["defmt"], optional = true }
embassy-rp = { git = "https://github.com/embassy-rs/embassy", features = ["rp235xb", "critical-section-impl", "time-driver", "defmt"], optional = true }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", optional = true }

# Cortex-M support
cortex-m = { version = "0.7", optional = true }
cortex-m-rt = { version = "0.7", optional = true }

# Logging
defmt = { version = "1.0", optional = true }
defmt-rtt = { version = "1.0", optional = true }

# USB for picotool compatibility (allows force-reboot to BOOTSEL)
embassy-usb = { git = "https://github.com/embassy-rs/embassy", optional = true }

# Panic handling
panic-probe = { version = "1.0", features = ["print-defmt"], optional = true }

# Embedded traits
embedded-hal = { version = "1.0", optional = true }
embedded-hal-async = { version = "1.0", optional = true }

# Static allocation
static_cell = { version = "2", optional = true }

# Display (firmware only - views use Display trait abstraction)
sh1106 = { version = "0.5", optional = true }
embedded-graphics = { version = "0.8", optional = true }

# SD card (0.9 has LFN support via iterate_dir_lfn)
embedded-sdmmc = { version = "0.9", default-features = false, optional = true }
embedded-hal-bus = { version = "0.2", optional = true }

[profile.release]
debug = 2
lto = true
opt-level = "s"

[profile.dev]
debug = 2
opt-level = 1
